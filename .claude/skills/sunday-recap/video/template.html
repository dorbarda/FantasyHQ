<!doctype html>
<html lang="he" dir="ltr">
<head>
<meta charset="utf-8">
<title>Sunday Showdown</title>
<link rel="stylesheet" href="../../../../node_modules/@fontsource/heebo/400.css">
<link rel="stylesheet" href="../../../../node_modules/@fontsource/heebo/700.css">
<link rel="stylesheet" href="../../../../node_modules/@fontsource/heebo/900.css">
<style>
  :root {
    --bg: #070B14; --bg2: #0F1626; --line: #1D2940;
    --text: #F4F7FB; --muted: #8C9AB3;
    --home: #FF7A1A; --away: #22D3EE; --win: #34D399; --lose: #F43F5E; --gold: #FACC15;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: 'Heebo', sans-serif; color: var(--text); }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .num { font-variant-numeric: tabular-nums; }

  /* world: background layers shared by every scene */
  #world { position: absolute; inset: 0; overflow: hidden; }
  .grid { position: absolute; inset: -200px; opacity: .22;
    background-image: linear-gradient(var(--line) 2px, transparent 2px), linear-gradient(90deg, var(--line) 2px, transparent 2px);
    background-size: 90px 90px; transform: perspective(900px) rotateX(58deg) translateY(380px); transform-origin: 50% 100%; }
  .glow { position: absolute; inset: 0; }
  .grain { position: absolute; inset: -50px; opacity: .07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%); }
  .scan { position: absolute; inset: 0; opacity: .06; background: repeating-linear-gradient(0deg, #fff 0 2px, transparent 2px 6px); }

  .scene { position: absolute; inset: 0; padding: 110px 64px 110px; display: none; flex-direction: column; direction: rtl; }
  .scene.watch, .scene.quick { justify-content: center; padding-bottom: 180px; }
  .el { will-change: transform, opacity; }

  /* wipe between scenes */
  #wipe { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  #wipe i { position: absolute; top: -400px; height: 2800px; width: 520px; transform: skewX(-18deg); }

  /* ticker */
  #ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: var(--home); color: #120700;
    display: flex; align-items: center; overflow: hidden; z-index: 15; font-weight: 900; font-size: 34px; }
  #ticker .live { background: #120700; color: var(--home); height: 100%; display: flex; align-items: center; padding: 0 28px; gap: 12px; z-index: 2; letter-spacing: 3px; }
  #ticker .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--lose); }
  #ticker .track { white-space: nowrap; direction: ltr; position: absolute; left: 0; }
  #topbar { position: absolute; top: 0; left: 0; right: 0; height: 74px; display: flex; justify-content: space-between; align-items: center;
    padding: 0 40px; z-index: 15; font-weight: 900; font-size: 30px; letter-spacing: 4px; color: var(--muted); direction: ltr; }
  #topbar b { color: var(--home); }

  /* intro */
  .center { justify-content: center; align-items: center; text-align: center; }
  .stamp { font-size: 230px; font-weight: 900; line-height: .9; letter-spacing: -6px; font-style: italic; }
  .outline { color: transparent; -webkit-text-stroke: 4px var(--text); }
  .kicker { font-size: 44px; font-weight: 900; letter-spacing: 14px; color: var(--home); }
  .heb-huge { font-size: 160px; font-weight: 900; line-height: 1; }
  .pill { display: inline-block; padding: 14px 38px; border-radius: 999px; font-size: 42px; font-weight: 900; background: var(--bg2); border: 3px solid var(--line); }

  /* board */
  .h1 { font-size: 120px; font-weight: 900; font-style: italic; letter-spacing: -3px; line-height: 1; }
  .h1 small { display: block; text-align: left; font-size: 42px; font-style: normal; letter-spacing: 0; color: var(--muted); font-weight: 700; margin-top: 14px; }
  .board { display: flex; flex-direction: column; gap: 26px; margin-top: 56px; }
  .brow { background: linear-gradient(90deg, rgba(255,122,26,.10), var(--bg2) 30%, var(--bg2) 70%, rgba(34,211,238,.10)); border: 2px solid var(--line);
    border-radius: 28px; padding: 22px 26px 18px; direction: ltr; }
  .brow .line { display: grid; grid-template-columns: 96px 1fr 120px 60px 120px 1fr 96px; align-items: center; gap: 10px; }
  .brow img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 4px solid var(--line); }
  .brow .n { font-size: 27px; font-weight: 900; line-height: 1.1; }
  .brow .n.r { text-align: right; }
  .brow .s { font-size: 56px; font-weight: 900; text-align: center; }
  .brow .vs { font-size: 30px; color: var(--muted); font-weight: 900; text-align: center; }
  .mbar { height: 14px; border-radius: 99px; background: var(--away); margin-top: 16px; overflow: hidden; display: flex; }
  .mbar i { display: block; height: 100%; background: var(--home); }
  .mlab { display: flex; justify-content: space-between; font-size: 26px; font-weight: 900; margin-top: 8px; }
  .mlab .h { color: var(--home); } .mlab .a { color: var(--away); }

  /* fight card */
  .split { position: absolute; inset: 0; }
  .split .a { position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,122,26,.30), transparent 55%); clip-path: polygon(0 0, 100% 0, 100% 38%, 0 58%); }
  .split .b { position: absolute; inset: 0; background: linear-gradient(340deg, rgba(34,211,238,.28), transparent 55%); clip-path: polygon(0 58%, 100% 38%, 100% 100%, 0 100%); }
  .fhead { display: flex; justify-content: space-between; align-items: center; direction: ltr; position: relative; }
  .fnum { font-size: 34px; font-weight: 900; letter-spacing: 6px; color: var(--muted); }
  .flabel { font-size: 44px; font-weight: 900; padding: 12px 34px; border-radius: 999px; background: var(--home); color: #120700; direction: rtl; }
  .flabel.cool { background: transparent; color: var(--text); border: 3px solid var(--line); }
  .fighter { display: grid; grid-template-columns: 250px 1fr; align-items: center; gap: 36px; direction: ltr; position: relative; }
  .fighter.away { grid-template-columns: 1fr 250px; }
  .fighter img { width: 250px; height: 250px; border-radius: 50%; object-fit: cover; border: 8px solid var(--home); box-shadow: 0 0 60px rgba(255,122,26,.45); }
  .fighter.away img { border-color: var(--away); box-shadow: 0 0 60px rgba(34,211,238,.45); }
  .fighter .who { display: flex; flex-direction: column; gap: 4px; }
  .fighter.away .who { text-align: right; }
  .fighter .tn { font-size: 50px; font-weight: 900; line-height: 1.05; }
  .fighter .ow { font-size: 34px; color: var(--muted); font-weight: 700; }
  .fighter .sc { font-size: 150px; font-weight: 900; line-height: .95; font-style: italic; letter-spacing: -4px; }
  .fighter.home .sc { color: var(--home); } .fighter.away .sc { color: var(--away); }
  .vsrow { position: relative; display: flex; justify-content: center; align-items: center; margin: 18px 0; height: 150px; }
  .vsrow .vs { font-size: 150px; font-weight: 900; font-style: italic; color: var(--text); text-shadow: 0 0 40px rgba(255,255,255,.35); }
  .vsrow .gap { position: absolute; right: 0; font-size: 34px; font-weight: 900; color: var(--muted); text-align: right; line-height: 1.25; }
  .vsrow .gap b { color: var(--text); font-size: 44px; }
  .stats { display: grid; grid-template-columns: 1fr 1.4fr 1fr; background: rgba(15,22,38,.85); border: 2px solid var(--line); border-radius: 28px; padding: 10px 30px; margin-top: 30px; position: relative; direction: ltr; }
  .stats div { padding: 12px 0; border-bottom: 2px solid var(--line); text-align: center; }
  .stats div:nth-last-child(-n+3) { border-bottom: 0; }
  .stats .v { font-size: 50px; font-weight: 900; }
  .stats .v.h { color: var(--home); } .stats .v.a { color: var(--away); }
  .stats .l { font-size: 30px; color: var(--muted); font-weight: 700; direction: rtl; align-self: center; display: flex; align-items: center; justify-content: center; }
  .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 26px; margin-top: 24px; direction: ltr; position: relative; }
  .keys .kp { font-size: 32px; font-weight: 700; }
  .keys .kp:nth-child(even) { text-align: right; }
  .keys .kp small { color: var(--muted); font-weight: 400; }
  .dtd { display: inline-block; background: var(--gold); color: #1a1400; font-size: 22px; font-weight: 900; padding: 2px 10px; border-radius: 8px; margin: 0 6px; vertical-align: middle; }
  .meter { margin-top: auto; position: relative; }
  .meter .t { text-align: center; font-size: 36px; font-weight: 900; margin-bottom: 14px; }
  .meter .t span { color: var(--win); }
  .meter .bar { height: 96px; border-radius: 999px; background: var(--away); overflow: hidden; display: flex; direction: ltr; position: relative; box-shadow: 0 0 50px rgba(0,0,0,.6); }
  .meter .bar i { display: block; height: 100%; background: var(--home); }
  .meter .bar b { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; font-size: 50px; font-weight: 900; color: #0a0a0a; }
  .meter .bar b.l { left: 34px; } .meter .bar b.r { right: 34px; }

  /* what if */
  .wif { font-size: 210px; font-weight: 900; font-style: italic; line-height: .9; letter-spacing: -6px; text-align: center; direction: ltr; }
  .player { text-align: center; margin-top: 30px; direction: ltr; }
  .player .pn { font-size: 104px; font-weight: 900; line-height: 1; letter-spacing: -2px; }
  .player .pm { font-size: 38px; color: var(--muted); font-weight: 700; margin-top: 14px; }
  .player .badge { display: inline-block; margin-top: 22px; background: var(--gold); color: #1a1400; font-size: 46px; font-weight: 900; padding: 8px 30px; border-radius: 14px; letter-spacing: 3px; }
  .branch { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 56px; }
  .case { border-radius: 36px; padding: 34px 26px; text-align: center; border: 4px solid; background: rgba(15,22,38,.9); }
  .case.yes { border-color: var(--win); } .case.no { border-color: var(--lose); }
  .case .q { font-size: 40px; font-weight: 900; }
  .case .p { font-size: 140px; font-weight: 900; line-height: 1; margin: 18px 0 6px; font-style: italic; letter-spacing: -3px; }
  .case.yes .p { color: var(--win); } .case.no .p { color: var(--lose); }
  .case .s { font-size: 30px; color: var(--muted); font-weight: 700; }
  .case .pr { font-size: 30px; font-weight: 700; margin-top: 12px; }
  .verdict { margin-top: 44px; text-align: center; font-size: 50px; font-weight: 900; line-height: 1.25; }
  .verdict span { color: var(--gold); }

  /* dtd watch */
  .wlist { display: flex; flex-direction: column; gap: 26px; margin-top: 60px; }
  .wrow { background: var(--bg2); border: 2px solid var(--line); border-radius: 30px; padding: 40px 34px; direction: ltr; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 20px; }
  .wrow .nm { font-size: 52px; font-weight: 900; line-height: 1.05; }
  .wrow .tm { font-size: 28px; color: var(--muted); font-weight: 700; margin-top: 6px; }
  .wrow .sw { display: flex; align-items: center; gap: 18px; font-size: 64px; font-weight: 900; font-style: italic; }
  .wrow .sw .y { color: var(--win); } .wrow .sw .n { color: var(--lose); }
  .wrow .sw .ar { color: var(--muted); font-size: 40px; font-style: normal; }
  .wlegend { margin-top: 26px; text-align: center; font-size: 32px; color: var(--muted); font-weight: 700; }
  .wlegend .y { color: var(--win); } .wlegend .n { color: var(--lose); }

  /* quick hits */
  .qlist { display: flex; flex-direction: column; gap: 36px; margin-top: 70px; }
  .q { background: var(--bg2); border: 2px solid var(--line); border-radius: 32px; padding: 44px 34px; direction: ltr; }
  .q .line { display: grid; grid-template-columns: 150px 1fr auto 1fr 150px; align-items: center; gap: 14px; }
  .q img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 5px solid var(--line); }
  .q img.fav { border-color: var(--win); }
  .q .sc { font-size: 86px; font-weight: 900; text-align: center; }
  .q .sc.fav { color: var(--win); }
  .q .dash { font-size: 50px; color: var(--muted); }
  .q .foot { text-align: center; font-size: 36px; color: var(--muted); font-weight: 700; margin-top: 20px; }
  .q .foot b { color: var(--text); } .q .foot .p { color: var(--win); font-weight: 900; }

  /* outro */
  .motn { font-size: 46px; letter-spacing: 12px; font-weight: 900; color: var(--gold); direction: ltr; }
  .ologos { display: flex; align-items: center; gap: 40px; margin: 50px 0 30px; direction: ltr; }
  .ologos img { width: 280px; height: 280px; border-radius: 50%; object-fit: cover; border: 8px solid var(--home); }
  .ologos img + span + img { border-color: var(--away); }
  .ologos span { font-size: 90px; font-weight: 900; font-style: italic; }
  .onames { font-size: 46px; font-weight: 900; direction: ltr; line-height: 1.3; }
  .oodds { font-size: 120px; font-weight: 900; font-style: italic; direction: ltr; margin-top: 20px; }
  .oodds .h { color: var(--home); } .oodds .a { color: var(--away); }
</style>
</head>
<body>
<div id="world">
  <div class="glow"></div>
  <div class="grid"></div>
</div>
<div id="stage"></div>
<div id="topbar"><span>FANTASY <b>HQ</b></span><span id="clock">WEEK</span></div>
<div id="ticker"><div class="track"></div><div class="live"><span class="dot"></span>LIVE</div></div>
<div id="wipe"><i></i><i></i><i></i></div>
<div class="grain" style="position:absolute;z-index:25"></div>
<div class="scan" style="z-index:25"></div>
<div class="vignette" style="z-index:24"></div>
<script>
/*
 * "Sunday Showdown" — broadcast-style recap. render(t) draws the frame at t
 * seconds, fully deterministic, so render.mjs steps it frame by frame.
 * Scenes are measured in beats of the soundtrack (120 BPM → 0.5 s), and
 * window.CUES (scene starts) feeds music.py, so hits land on the cuts.
 * Data: window.RECAP from recap-data.mts.
 */
const D = window.RECAP;
const BEAT = 0.5;
// Close = the underdog still has ≥ 10% → full fight card. The rest → quick hits.
const CLOSE_MAX_FAV = 90;
// A doubtful player gets his own WHAT IF scene when he swings the odds this much.
const BIG_SWING = 15;

const games = D.matchups;
const close = games.filter(m => m.favoriteWinProb < CLOSE_MAX_FAV);
const decided = games.filter(m => m.favoriteWinProb >= CLOSE_MAX_FAV);
const allWhatIf = games.flatMap(m => m.whatIf.map(w => ({ ...w, m })));
const swing = w => Math.abs(w.ifPlays.homeWinProb - w.ifSits.homeWinProb);
// Win % of the player's own team.
const own = (w, p) => w.side === 'home' ? p : 100 - p;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const logo = src => src ? `../../../../public${src}` : '../../../../public/icon-192.png';
const left = m => m.home.gamesLeftWeek + m.away.gamesLeftWeek > 0;
// No 100% / 0% while games are left; away = 100 − home so the pair sums to 100.
const fmt = (p, open) => open && p > 99 ? '>99%' : open && p < 1 ? '<1%' : `${Math.round(p)}%`;
const pair = m => { const h = Math.round(m.home.winProb); return [fmt(m.home.winProb, left(m)), fmt(100 - h, left(m))]; };
const short = n => n.length > 22 ? n.slice(0, 21) + '…' : n;

// ── timeline ────────────────────────────────────────────────────────────────
const scenes = [];
const add = (beats, html, kind) => scenes.push({ beats, html, kind });

add(10, `
  <div class="kicker el ltr" data-in="0.1" data-fx="slam">WEEK ${D.week} · ${games.length} MATCHUPS</div>
  <div class="stamp el ltr" data-in="0.5" data-fx="slam" style="margin-top:40px">SUNDAY</div>
  <div class="stamp el ltr" data-in="1.0" data-fx="slam" style="color:var(--away)">SHOW</div>
  <div class="stamp el ltr" data-in="1.5" data-fx="slam" style="color:var(--home)">DOWN</div>
  <div class="heb-huge el" data-in="2.5" data-fx="slam" style="margin-top:60px">הלילה האחרון</div>
  <div class="pill el" data-in="3.4" style="margin-top:40px">הכל נקבע הלילה 🔥</div>`, 'intro center');

add(12, `
  <div class="h1 el ltr" data-in="0.05" data-fx="left">THE BOARD<small style="direction:rtl">המצב לפני הלילה האחרון</small></div>
  <div class="board">${games.map((m, i) => {
    const [ph, pa] = pair(m);
    return `<div class="brow el" data-in="${0.5 + i * 0.5}" data-fx="left">
      <div class="line">
        <img src="${logo(m.home.logo)}"><div class="n">${esc(short(m.home.name))}</div>
        <div class="s num" data-count="${m.home.live}" data-at="${0.6 + i * 0.5}">0</div><div class="vs">VS</div>
        <div class="s num" data-count="${m.away.live}" data-at="${0.6 + i * 0.5}">0</div>
        <div class="n r">${esc(short(m.away.name))}</div><img src="${logo(m.away.logo)}">
      </div>
      <div class="mbar"><i data-fill="${m.home.winProb}" data-at="${1 + i * 0.5}"></i></div>
      <div class="mlab"><span class="h">${ph}</span><span class="a">${pa}</span></div>
    </div>`; }).join('')}
  </div>`, 'board');

close.forEach((m, i) => {
  const [ph, pa] = pair(m);
  const label = i === 0 ? ['קרב הלילה 🔥', ''] : m.favoriteWinProb < 70 ? ['צמוד! ⚡', ''] : ['עדיין פתוח 👀', 'cool'];
  const kp = s => s.keyPlayersTonight.map(p =>
    `<div class="kp">${esc(p.name)}${p.status !== 'ACTIVE' ? '<span class="dtd">DTD</span>' : ''} <small>${p.avg}</small></div>`);
  const hk = kp(m.home), ak = kp(m.away);
  const keyRows = Array.from({ length: Math.max(hk.length, ak.length) }, (_, j) => (hk[j] ?? '<div></div>') + (ak[j] ?? '<div></div>')).join('');
  const lead = m.leader ? `<span>פער</span><br><b class="num">${Math.round(m.gap)}</b>` : '<b>שוויון!</b>';
  add(12, `
  <div class="split"><div class="a"></div><div class="b"></div></div>
  <div class="fhead el" data-in="0.05" data-fx="drop"><span class="fnum">MATCHUP ${games.indexOf(m) + 1}/${games.length}</span><span class="flabel ${label[1]}">${label[0]}</span></div>
  <div class="fighter home" style="margin-top:46px">
    <img class="el" data-in="0.2" data-fx="left" src="${logo(m.home.logo)}">
    <div class="who el" data-in="0.35" data-fx="left"><div class="tn">${esc(m.home.name)}</div><div class="ow">${esc(m.home.owner)}</div>
      <div class="sc num" data-count="${m.home.live}" data-at="0.4">0</div></div>
  </div>
  <div class="vsrow"><div class="vs el ltr" data-in="0.9" data-fx="slam">VS</div><div class="gap el" data-in="1.2">${lead}</div></div>
  <div class="fighter away">
    <div class="who el" data-in="0.55" data-fx="right"><div class="tn">${esc(m.away.name)}</div><div class="ow">${esc(m.away.owner)}</div>
      <div class="sc num" data-count="${m.away.live}" data-at="0.6">0</div></div>
    <img class="el" data-in="0.4" data-fx="right" src="${logo(m.away.logo)}">
  </div>
  <div class="stats el" data-in="1.6">
    <div class="v h">${m.home.playersLeftTonight}</div><div class="l">שחקנים הלילה</div><div class="v a">${m.away.playersLeftTonight}</div>
    <div class="v h">${m.home.movesLeft}</div><div class="l">מהלכים שנשארו</div><div class="v a">${m.away.movesLeft}</div>
    <div class="v h num">${Math.round(m.home.projected)}</div><div class="l">תחזית סיום</div><div class="v a num">${Math.round(m.away.projected)}</div>
  </div>
  <div class="keys el" data-in="2.1">${keyRows}</div>
  <div class="meter el" data-in="2.5">
    <div class="t">סיכוי לנצח · מועדפת: <span class="ltr">${esc(m.projectedWinner)}</span></div>
    <div class="bar"><i data-fill="${m.home.winProb}" data-at="2.7"></i><b class="l">${ph}</b><b class="r">${pa}</b></div>
  </div>`, 'fight');

  // Big what-ifs right after their matchup.
  m.whatIf.filter(w => swing(w) >= BIG_SWING).forEach(w => {
    const yes = own(w, w.ifPlays.homeWinProb), no = own(w, w.ifSits.homeWinProb);
    const flips = (yes >= 50) !== (no >= 50);
    const first = w.player.split(' ')[0];
    add(14, `
    <div class="wif el" data-in="0.05" data-fx="glitch">WHAT<br><span style="color:var(--gold)">IF?</span></div>
    <div class="player">
      <div class="pn el" data-in="0.7" data-fx="slam">${esc(w.player.toUpperCase())}</div>
      <div class="pm el" data-in="0.9">${esc(w.team)} · ${w.nba} · ${w.avg} FPTS</div>
      <div class="badge el" data-in="1.1" data-fx="pulse">DAY-TO-DAY</div>
    </div>
    <div class="branch">
      <div class="case yes el" data-in="1.8" data-fx="left"><div class="q">✅ משחק</div><div class="p ltr num" data-count="${yes}" data-at="2.0" data-pct="${left(m)}">0</div><div class="s">סיכוי לנצח</div><div class="pr">תחזית <b class="num">${Math.round(w.ifPlays.projected)}</b></div></div>
      <div class="case no el" data-in="2.6" data-fx="right"><div class="q">❌ לא משחק</div><div class="p ltr num" data-count="${no}" data-at="2.8" data-pct="${left(m)}">0</div><div class="s">סיכוי לנצח</div><div class="pr">תחזית <b class="num">${Math.round(w.ifSits.projected)}</b></div></div>
    </div>
    <div class="verdict el" data-in="3.8" data-fx="slam">${flips
      ? `בלי <span class="ltr">${esc(first)}</span> המאצ'אפ <span>מתהפך</span> 😱`
      : `<span class="ltr">${esc(first)}</span> שווה <span class="num">${Math.round(Math.abs(yes - no))}%</span> בסיכוי לנצח`}</div>`, 'whatif');
  });
});

if (allWhatIf.length) {
  const rows = [...allWhatIf].sort((a, b) => swing(b) - swing(a)).slice(0, 5);
  add(12, `
  <div class="h1 el ltr" data-in="0.05" data-fx="left">DTD WATCH<small style="direction:rtl">שחקנים בספק — סיכוי הקבוצה שלהם לנצח</small></div>
  <div class="wlist">${rows.map((w, i) => `
    <div class="wrow el" data-in="${0.5 + i * 0.45}" data-fx="right">
      <div><div class="nm">${esc(w.player)} <span class="dtd">DTD</span></div><div class="tm">${esc(w.team)} · ${w.avg} FPTS</div></div>
      <div class="sw"><span class="y">${fmt(own(w, w.ifPlays.homeWinProb), true)}</span><span class="ar">→</span><span class="n">${fmt(own(w, w.ifSits.homeWinProb), true)}</span></div>
    </div>`).join('')}
  </div>
  <div class="wlegend el" data-in="${0.8 + rows.length * 0.45}"><span class="y">משחק</span> → <span class="n">לא משחק</span></div>`, 'watch');
}

for (let i = 0; i < decided.length; i += 3) {
  const group = decided.slice(i, i + 3);
  add(10, `
  <div class="h1 el ltr" data-in="0.05" data-fx="left">QUICK HITS<small style="direction:rtl">כמעט סגור ✅</small></div>
  <div class="qlist">${group.map((m, j) => {
    const hf = m.home.winProb >= m.away.winProb;
    const fav = hf ? m.home : m.away;
    return `<div class="q el" data-in="${0.5 + j * 0.5}" data-fx="${j % 2 ? 'right' : 'left'}">
      <div class="line"><img class="${hf ? 'fav' : ''}" src="${logo(m.home.logo)}"><div class="sc num ${hf ? 'fav' : ''}">${Math.round(m.home.live)}</div><div class="dash">–</div>
      <div class="sc num ${hf ? '' : 'fav'}">${Math.round(m.away.live)}</div><img class="${hf ? '' : 'fav'}" src="${logo(m.away.logo)}"></div>
      <div class="foot"><b>${esc(fav.name)}</b> · <span class="p">${fmt(fav.winProb, left(m))}</span> · gap <b>${Math.round(m.gap)}</b></div>
    </div>`; }).join('')}
  </div>`, 'quick');
}

const motn = games[0];
const [oh, oa] = pair(motn);
add(12, `
  <div class="motn el" data-in="0.05" data-fx="drop">★ MATCH OF THE NIGHT ★</div>
  <div class="ologos"><img class="el" data-in="0.3" data-fx="left" src="${logo(motn.home.logo)}"><span class="el ltr" data-in="0.7" data-fx="slam">VS</span><img class="el" data-in="0.3" data-fx="right" src="${logo(motn.away.logo)}"></div>
  <div class="onames el" data-in="1.0">${esc(motn.home.name)}<br><span style="color:var(--muted)">vs</span><br>${esc(motn.away.name)}</div>
  <div class="oodds el" data-in="1.5" data-fx="slam"><span class="h">${oh}</span> – <span class="a">${oa}</span></div>
  <div class="heb-huge el" data-in="2.4" data-fx="slam" style="font-size:110px;margin-top:50px">נתראה הלילה 🍿</div>
  <div class="kicker el ltr" data-in="3.0" style="margin-top:40px">FANTASY HQ</div>`, 'outro center');

// lay out
let at = 0;
const stage = document.getElementById('stage');
stage.innerHTML = scenes.map(s => {
  const start = at; at += s.beats * BEAT;
  s.start = start; s.end = at;
  return `<section class="scene ${s.kind}" data-start="${start}" data-end="${at}">${s.html}</section>`;
}).join('');
window.DURATION = at;
window.CUES = scenes.map(s => ({ t: s.start, kind: s.kind.split(' ')[0] }));

// ticker text
const tick = games.map(m => `${m.home.name} ${Math.round(m.home.live)} – ${Math.round(m.away.live)} ${m.away.name}`).join('   •   ');
document.querySelector('#ticker .track').textContent = (tick + '   •   ').repeat(4);
document.getElementById('clock').textContent = `WEEK ${D.week} · FINAL NIGHT`;

// ── render ─────────────────────────────────────────────────────────────────
const clamp = x => Math.max(0, Math.min(1, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeBack = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// Deterministic pseudo-random for glitch / shake.
const rnd = n => { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); };
const sections = [...stage.querySelectorAll('.scene')];
const wipeBars = [...document.querySelectorAll('#wipe i')];
const wipeColors = ['var(--home)', 'var(--away)', '#F4F7FB'];
const glow = document.querySelector('#world .glow');
const grid = document.querySelector('#world .grid');
const track = document.querySelector('#ticker .track');
const grain = document.querySelector('.grain');

window.render = t => {
  window.scrollTo(0, 0);
  const beatPos = t / BEAT;
  const pulse = Math.exp(-(beatPos % 1) * 5);   // 1 on the beat, fades fast
  const idx = scenes.findIndex(s => t >= s.start && t < s.end);
  const cur = scenes[idx === -1 ? scenes.length - 1 : idx];
  const lt = t - cur.start;

  // background
  glow.style.background = `radial-gradient(900px 800px at 50% ${-5 + 3 * Math.sin(t)}%, rgba(255,122,26,${0.20 + 0.10 * pulse}), transparent 70%),
    radial-gradient(900px 700px at 50% 108%, rgba(34,211,238,${0.16 + 0.06 * pulse}), transparent 70%)`;
  grid.style.backgroundPosition = `0 ${(t * 120) % 90}px`;
  track.style.transform = `translateX(${-(t * 140) % 4000}px)`;
  grain.style.transform = `translate(${Math.floor(rnd(Math.floor(t * 30)) * 50) - 25}px, ${Math.floor(rnd(Math.floor(t * 30) + 7) * 50) - 25}px)`;

  // wipe: bars sweep across around each cut (except the very start)
  const nearest = scenes.reduce((b, s) => Math.abs(t - s.start) < Math.abs(t - b) ? s.start : b, 1e9);
  wipeBars.forEach((bar, k) => {
    const p = (t - nearest + 0.28 - k * 0.05) / 0.56;   // 0 → 1 across the cut
    const on = nearest > 0 && p > 0 && p < 1;
    bar.style.display = on ? 'block' : 'none';
    if (on) { bar.style.left = `${-700 + p * 2600}px`; bar.style.background = wipeColors[k]; bar.style.opacity = k === 2 ? .9 : 1; }
  });

  for (const sc of sections) {
    const s = +sc.dataset.start, e = +sc.dataset.end;
    const on = t >= s && t < e || (sc === sections.at(-1) && t >= s);
    sc.style.display = on ? 'flex' : 'none';
    if (!on) continue;
    const l = t - s;
    // camera: slow push-in + tiny kick on the beat
    sc.style.transform = `scale(${1 + l * 0.006 + pulse * 0.006})`;
    for (const el of sc.querySelectorAll('.el')) {
      const d = l - +el.dataset.in, fx = el.dataset.fx || 'up';
      const p = easeOut(d / 0.45);
      let tr = '', op = p;
      if (fx === 'slam') { const q = easeBack(d / 0.35); op = clamp(d / 0.12); tr = `scale(${1.8 - 0.8 * q})`; }
      else if (fx === 'left') tr = `translateX(${(1 - p) * -260}px)`;
      else if (fx === 'right') tr = `translateX(${(1 - p) * 260}px)`;
      else if (fx === 'drop') tr = `translateY(${(1 - p) * -120}px)`;
      else if (fx === 'pulse') tr = `scale(${(0.9 + 0.1 * p) * (1 + 0.06 * pulse)})`;
      else if (fx === 'glitch') {
        const g = d < 0.6 ? (rnd(Math.floor(t * 30)) - 0.5) * 60 : 0;
        tr = `translateX(${g}px) skewX(${d < 0.6 ? g / 6 : 0}deg) scale(${1 + 0.03 * pulse})`;
        el.style.textShadow = d < 0.9 ? `${g / 3}px 0 var(--lose), ${-g / 3}px 0 var(--away)` : 'none';
        op = clamp(d / 0.1);
      } else tr = `translateY(${(1 - p) * 70}px)`;
      el.style.opacity = d < 0 ? 0 : op;
      el.style.transform = tr;
    }
    for (const el of sc.querySelectorAll('[data-count]')) {
      const p = easeOut((l - +el.dataset.at) / 1.1), v = +el.dataset.count * p;
      el.textContent = el.dataset.pct != null ? fmt(v, el.dataset.pct === 'true' && p >= 1) : Math.round(v);
    }
    for (const el of sc.querySelectorAll('[data-fill]')) {
      const p = easeOut((l - +el.dataset.at) / 1.3);
      el.style.width = `${50 + (+el.dataset.fill - 50) * p}%`;
    }
  }
};
window.render(0);
</script>
</body>
</html>
