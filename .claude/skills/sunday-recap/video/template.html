<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Sunday Recap</title>
<link rel="stylesheet" href="../../../../node_modules/@fontsource/heebo/400.css">
<link rel="stylesheet" href="../../../../node_modules/@fontsource/heebo/700.css">
<link rel="stylesheet" href="../../../../node_modules/@fontsource/heebo/900.css">
<style>
  :root {
    --bg: #0B1628; --bg2: #13233D; --line: #1E3050;
    --text: #F0F4F8; --muted: #94A3B8;
    --accent: #C8956C; --hot: #FB923C; --win: #34D399; --lose: #F87171;
    --home: #C8956C; --away: #60A5FA;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: 'Heebo', sans-serif; color: var(--text); }
  .scene { position: absolute; inset: 0; padding: 90px 70px 100px; display: flex; flex-direction: column; opacity: 0; }
  .bg-glow { position: absolute; inset: 0; background:
      radial-gradient(900px 700px at 50% -10%, rgba(200,149,108,.22), transparent 70%),
      radial-gradient(800px 600px at 50% 110%, rgba(96,165,250,.14), transparent 70%); }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .el { will-change: transform, opacity; }

  /* intro / outro */
  .center { justify-content: center; align-items: center; text-align: center; gap: 36px; }
  .brand { font-size: 54px; font-weight: 700; letter-spacing: 6px; color: var(--accent); }
  .big { font-size: 150px; font-weight: 900; line-height: 1.02; }
  .sub { font-size: 58px; font-weight: 700; color: var(--muted); }
  .hero-logo { width: 360px; height: 360px; border-radius: 64px; object-fit: cover; box-shadow: 0 20px 80px rgba(200,149,108,.35); }

  /* matchup card */
  .top { display: flex; justify-content: space-between; align-items: center; }
  .tag { font-size: 46px; font-weight: 900; padding: 14px 36px; border-radius: 999px; background: var(--bg2); border: 3px solid var(--line); }
  .tag.hot { background: var(--hot); color: #1a0d00; border-color: var(--hot); }
  .tag.close { border-color: var(--accent); color: var(--accent); }
  .count { font-size: 38px; color: var(--muted); font-weight: 700; }

  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 44px; }
  .team { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
  .logo { width: 190px; height: 190px; border-radius: 50%; object-fit: cover; border: 6px solid var(--line); background: var(--bg2); }
  .team.home .logo { border-color: var(--home); }
  .team.away .logo { border-color: var(--away); }
  .tname { font-size: 44px; font-weight: 900; line-height: 1.1; min-height: 97px; display: flex; align-items: center; }
  .owner { font-size: 36px; color: var(--muted); font-weight: 700; }
  .score { font-size: 124px; font-weight: 900; line-height: 1; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .gapline { text-align: center; font-size: 46px; font-weight: 700; margin-top: 24px; color: var(--muted); }
  .gapline b { color: var(--text); font-weight: 900; }

  .rows { margin-top: 36px; background: var(--bg2); border: 3px solid var(--line); border-radius: 36px; padding: 18px 44px; }
  .row { display: grid; grid-template-columns: 1fr 1.5fr 1fr; align-items: center; padding: 16px 0; border-bottom: 2px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .v { font-size: 52px; font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; }
  .row .l { font-size: 34px; color: var(--muted); font-weight: 700; text-align: center; }

  .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 30px; margin-top: 32px; }
  .keys h4 { grid-column: 1 / -1; text-align: center; font-size: 38px; color: var(--accent); font-weight: 900; }
  .klist { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .kp { font-size: 32px; font-weight: 700; text-align: center; }
  .kp small { color: var(--muted); font-size: 28px; font-weight: 400; }
  .kp .dtd { color: var(--hot); font-size: 26px; }
  .none { font-size: 32px; color: var(--muted); }

  .prob { margin-top: auto; }
  .prob .winner { text-align: center; font-size: 46px; font-weight: 900; margin-bottom: 18px; }
  .prob .winner span { color: var(--win); }
  .bar { position: relative; height: 84px; border-radius: 999px; overflow: hidden; background: var(--away); display: flex; }
  .bar .fill { height: 100%; background: var(--home); }
  .bar .pct { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; font-size: 46px; font-weight: 900; color: #0B1628; }
  .bar .pct.r { right: 36px; } .bar .pct.l { left: 36px; }
  .barlabel { text-align: center; font-size: 32px; color: var(--muted); margin-top: 16px; font-weight: 700; }

  /* decided matchups — compact list */
  .mini-list { display: flex; flex-direction: column; gap: 40px; margin-top: 70px; }
  .mini { background: var(--bg2); border: 3px solid var(--line); border-radius: 36px; padding: 34px 36px; }
  .mteams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; }
  .mside { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .mlogo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid var(--line); }
  .mname { font-size: 34px; font-weight: 900; line-height: 1.1; min-height: 75px; display: flex; align-items: center; }
  .mscore { font-size: 76px; font-weight: 900; line-height: 1; }
  .mvs { font-size: 60px; color: var(--muted); font-weight: 900; }
  .mline { text-align: center; font-size: 32px; color: var(--muted); font-weight: 700; margin-top: 22px; }
  .mline b { color: var(--text); }
  .mpct { color: var(--win); font-weight: 900; }
  .mside.fav .mlogo { border-color: var(--win); }
  .mside.fav .mscore { color: var(--win); }
  /* story screens */
  .stitle { text-align: center; font-size: 76px; font-weight: 900; margin-top: 34px; line-height: 1.1; }
  .spath { text-align: center; font-size: 38px; color: var(--muted); font-weight: 700; margin-top: 14px; }
  .spath b { color: var(--text); }
  .chart { margin-top: 30px; background: var(--bg2); border: 3px solid var(--line); border-radius: 36px; padding: 24px 30px 14px; }
  .chart h5 { font-size: 28px; font-weight: 700; color: var(--muted); text-align: center; margin-bottom: 6px; }
  .chart h5 .h { color: var(--home); } .chart h5 .a { color: var(--away); }
  .chart svg { display: block; width: 100%; height: auto; }
  .lines { margin-top: 30px; display: flex; flex-direction: column; gap: 16px; }
  .sl { font-size: 40px; font-weight: 700; line-height: 1.25; padding-right: 40px; position: relative; }
  .sl::before { content: ''; position: absolute; right: 0; top: 20px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); }
  .need { margin-top: auto; background: linear-gradient(180deg, rgba(251,146,60,.18), rgba(251,146,60,.06)); border: 4px solid var(--hot); border-radius: 40px; padding: 30px 40px; text-align: center; }
  .need h4 { font-size: 44px; font-weight: 900; color: var(--hot); }
  .need .nbig { font-size: 110px; font-weight: 900; line-height: 1.05; margin-top: 8px; }
  .need .nbig small { font-size: 46px; font-weight: 700; color: var(--muted); }
  .need .nsub { font-size: 36px; font-weight: 700; color: var(--muted); margin-top: 8px; line-height: 1.3; }
  .need .nsub b { color: var(--text); }
  .sfoot { margin-top: auto; text-align: center; font-size: 44px; font-weight: 900; }
  .sfoot span { color: var(--win); }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div id="stage"></div>
<script>
/*
 * Timeline renderer. render(t) draws the frame at t seconds — fully
 * deterministic, so the Playwright script can step frame by frame.
 * Data comes from window.RECAP (recap-data.mts output).
 */
const D = window.RECAP;
const INTRO = 3, CARD = 6, STORY_CLOSE = 7.5, STORY = 6.5, LIST = 5, OUTRO = 3.5, FADE = 0.35;
const STORIES = window.STORIES || {};
const storyOf = m => STORIES[`${m.home.teamId}-${m.away.teamId}`];
// A matchup is "close" while the underdog still has at least this chance.
// Close ones get a full card; the rest share compact screens, up to PER_LIST each.
// 90: on the last night a 10% underdog is still worth a full card.
const CLOSE_MAX_FAV = 90, PER_LIST = 3;
// Order: closest first, biggest blowouts last (recap-data.mts already sorts so).
const games = D.matchups;
const close = games.filter(m => m.favoriteWinProb < CLOSE_MAX_FAV);
const decided = games.filter(m => m.favoriteWinProb >= CLOSE_MAX_FAV);
// With a story, every decided matchup gets its own story screen; without, compact lists.
const withStories = decided.every(storyOf);
const lists = [];
if (!withStories) for (let i = 0; i < decided.length; i += PER_LIST) lists.push(decided.slice(i, i + PER_LIST));
const closeLen = m => CARD + (storyOf(m) ? STORY_CLOSE : 0);
const closeStart = close.map((_, i) => INTRO + close.slice(0, i).reduce((n, m) => n + closeLen(m), 0));
const afterClose = INTRO + close.reduce((n, m) => n + closeLen(m), 0);
const decidedLen = withStories ? decided.length * STORY : lists.length * LIST;
const total = afterClose + decidedLen + OUTRO;
window.DURATION = total;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const logo = src => src ? `../../../../public${src}` : '../../../../public/icon-192.png';
// Same rule as the site: no 100% / 0% while games are left. Away = 100 − home so the pair sums to 100.
const pct = (p, gamesLeft, other) => gamesLeft && p > 99 ? '>99%' : gamesLeft && p < 1 ? '<1%'
  : `${other == null ? Math.round(p) : 100 - Math.round(other)}%`;
const tag = fav => fav < 65 ? ['צמוד! 🔥', 'hot'] : ['פתוח', 'close'];
const closest = games[0];
const playersLeft = m => m.home.playersLeftTonight + m.away.playersLeftTonight > 0;
const favPct = m => {
  const homeFav = m.home.winProb >= m.away.winProb;
  return homeFav ? pct(m.home.winProb, playersLeft(m)) : pct(m.away.winProb, playersLeft(m), m.home.winProb);
};

const stage = document.getElementById('stage');
let html = `
<section class="scene center" data-start="0" data-end="${INTRO}">
  <div class="brand el ltr" data-in="0.1">FANTASY HQ</div>
  <img class="hero-logo el" data-in="0.25" src="../../../../public/icon-maskable-512.png">
  <div class="big el" data-in="0.45">הלילה<br>האחרון</div>
  <div class="sub el" data-in="0.8">שבוע ${D.week} · ${games.length} מאצ'אפים · לילה אחד</div>
</section>`;

const DAY = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
// Lead after each day as bars: up = home ahead (home color), down = away ahead.
function leadChart(m) {
  const path = m.leadPath || [];
  if (!path.length) return '';
  // Room for value labels above/below the bars and day labels at the bottom.
  const W = 900, H = 330, LAB = 44, DAYS = 46;
  const up = Math.max(0, ...path.map(p => p.lead)), down = Math.max(0, ...path.map(p => -p.lead));
  const area = H - DAYS - 2 * LAB, scale = area / Math.max(40, up + down);
  const mid = LAB + up * scale + (up + down < 40 ? (40 - up - down) * scale / 2 : 0);
  const bw = W / path.length;
  const bars = path.map((p, i) => {
    const h = Math.max(4, Math.abs(p.lead) * scale), x = i * bw + bw * 0.18, w = bw * 0.64;
    const up = p.lead >= 0, y = up ? mid - h : mid;
    const col = up ? 'var(--home)' : 'var(--away)';
    const ty = up ? y - 12 : y + h + 34;
    return `<rect class="bar-g" data-i="${i}" x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${col}"/>
      <text x="${x + w / 2}" y="${ty}" text-anchor="middle" font-size="30" font-weight="900" fill="var(--text)" direction="ltr">${up ? '+' : '−'}${Math.round(Math.abs(p.lead))}</text>
      <text x="${x + w / 2}" y="${H - 4}" text-anchor="middle" font-size="30" font-weight="700" fill="var(--muted)">${DAY[new Date(p.date + 'T12:00:00Z').getUTCDay()]}</text>`;
  }).join('');
  return `<div class="chart el" data-in="0.9">
    <h5>הפער בסוף כל יום · <span class="h ltr">▲ ${esc(m.home.name)}</span> · <span class="a ltr">▼ ${esc(m.away.name)}</span></h5>
    <svg viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--line)" stroke-width="3"/>${bars}</svg>
  </div>`;
}
const storyLines = (st, max, from = 1.4) => st.lines.slice(0, max)
  .map((l, k) => `<div class="sl el" data-in="${from + k * 0.35}">${ltrBits(l)}</div>`).join('');
// In story lines, {text} marks an English name or a signed number: kept left-to-right.
function ltrBits(l) { return esc(l).replace(/\{([^}]+)\}/g, '<span class="ltr">$1</span>'); }
// Favorite's win % at the start of the week vs now.
function winPathLine(m) {
  if (!m.homeWinPath) return '';
  const homeFav = m.home.winProb >= m.away.winProb;
  const startP = homeFav ? m.homeWinPath[0] : 100 - m.homeWinPath[0];
  return `<div class="spath el" data-in="0.6">סיכוי לניצחון של <b class="ltr">${esc(m.projectedWinner)}</b><br>בתחילת השבוע <b class="ltr">${Math.round(startP)}%</b> ← עכשיו <b class="ltr">${favPct(m)}</b></div>`;
}

close.forEach((m, i) => {
  const start = closeStart[i];
  const [label, cls] = i === 0 ? ['קרב השבוע 🔥', 'hot'] : tag(m.favoriteWinProb);
  const side = (s, which) => `
    <div class="team ${which}">
      <img class="logo el" data-in="0.15" src="${logo(s.logo)}">
      <div class="tname el ltr" data-in="0.25">${esc(s.name)}</div>
      <div class="owner el" data-in="0.3">${esc(s.owner)}</div>
      <div class="score el" data-in="0.35" data-count="${s.live}">0</div>
    </div>`;
  const keys = s => s.keyPlayersTonight.length
    ? s.keyPlayersTonight.map(p => `<div class="kp ltr">${esc(p.name)} <small>${p.nba} · ${p.avg}</small>${p.status !== 'ACTIVE' ? ` <span class="dtd">(${p.status === 'DAY_TO_DAY' ? 'DTD' : esc(p.status)})</span>` : ''}</div>`).join('')
    : `<div class="none">אין שחקנים הלילה</div>`;
  const gapText = m.leader ? `פער: <b>${m.gap}</b> לטובת <b class="ltr">${esc(m.leader)}</b>` : `<b>שוויון מוחלט!</b>`;
  const left = playersLeft(m);
  html += `
<section class="scene" data-start="${start}" data-end="${start + CARD}">
  <div class="top">
    <div class="tag ${cls} el" data-in="0.05">${label}</div>
    <div class="count el ltr" data-in="0.05">${i + 1} / ${games.length}</div>
  </div>
  <div class="teams">${side(m.home, 'home')}${side(m.away, 'away')}</div>
  <div class="gapline el" data-in="1.0">${gapText}</div>
  <div class="rows el" data-in="1.4">
    <div class="row"><div class="v">${m.home.playersLeftTonight}</div><div class="l">שחקנים שנשארו הלילה</div><div class="v">${m.away.playersLeftTonight}</div></div>
    <div class="row"><div class="v">${m.home.movesLeft}</div><div class="l">מהלכים שנשארו</div><div class="v">${m.away.movesLeft}</div></div>
    <div class="row"><div class="v">${Math.round(m.home.projected)}</div><div class="l">תחזית סיום</div><div class="v">${Math.round(m.away.projected)}</div></div>
  </div>
  <div class="keys el" data-in="2.0">
    <h4>⭐ שחקני מפתח הלילה</h4>
    <div class="klist">${keys(m.home)}</div>
    <div class="klist">${keys(m.away)}</div>
  </div>
  <div class="prob el" data-in="2.6">
    <div class="winner">מנצח צפוי: <span class="ltr">${esc(m.projectedWinner)}</span></div>
    <div class="bar">
      <div class="fill" data-fill="${m.home.winProb}"></div>
      <div class="pct r ltr">${pct(m.home.winProb, left)}</div>
      <div class="pct l ltr">${pct(m.away.winProb, left, m.home.winProb)}</div>
    </div>
    <div class="barlabel">סיכוי לנצח</div>
  </div>
</section>`;
  const st = storyOf(m), u = m.underdogTonight;
  if (!st) return;
  const s2 = start + CARD;
  const fav = m.projectedWinner;
  html += `
<section class="scene" data-start="${s2}" data-end="${s2 + STORY_CLOSE}">
  <div class="top">
    <div class="tag ${cls} el" data-in="0.05">איך הגענו לכאן?</div>
    <div class="count el ltr" data-in="0.05">${i + 1} / ${games.length}</div>
  </div>
  <div class="stitle el" data-in="0.3">${esc(st.title)}</div>
  ${winPathLine(m)}
  ${leadChart(m)}
  <div class="lines">${storyLines(st, 4)}</div>
  ${u && u.perPlayerNeeded != null ? `
  <div class="need el" data-in="3.2">
    <h4>🎯 מה <span class="ltr">${esc(u.team)}</span> צריך הלילה?</h4>
    <div class="nbig"><span class="ltr">${u.perPlayerNeeded}</span> <small>נק' לשחקן</small></div>
    <div class="nsub"><b class="ltr">${Math.floor(u.pointsNeeded) + 1}+</b> נק' מ-<b>${u.players}</b> שחקנים · הצפי שלהם: <b class="ltr">${u.expectedPerPlayer}</b> לשחקן</div>
    <div class="nsub">אם <span class="ltr">${esc(fav)}</span> יעשו את הצפי: <b class="ltr">${Math.round(u.favoriteExpectedPoints)}</b> נק' מ-<b>${u.favoritePlayers}</b> שחקנים</div>
  </div>` : ''}
</section>`;
});

// Decided matchups, each with its story (when stories.json has them all).
if (withStories) decided.forEach((m, j) => {
  const start = afterClose + j * STORY, st = storyOf(m);
  const team = (s, fav) => `
      <div class="mside${fav ? ' fav' : ''}">
        <img class="mlogo" src="${logo(s.logo)}">
        <div class="mname ltr">${esc(s.name)}</div>
        <div class="mscore">${Math.round(s.live)}</div>
      </div>`;
  const done = m.favoriteWinProb >= 99;
  html += `
<section class="scene" data-start="${start}" data-end="${start + STORY}">
  <div class="top">
    <div class="tag el" data-in="0.05">${done ? 'סגור ✅' : 'כמעט גמור ✅'}</div>
    <div class="count el ltr" data-in="0.05">${close.length + j + 1} / ${games.length}</div>
  </div>
  <div class="mteams el" data-in="0.15" style="margin-top:36px">${team(m.home, m.home.winProb >= m.away.winProb)}<div class="mvs">–</div>${team(m.away, m.away.winProb > m.home.winProb)}</div>
  <div class="stitle el" data-in="0.4">${esc(st.title)}</div>
  ${winPathLine(m)}
  ${leadChart(m)}
  <div class="lines">${storyLines(st, 5, 1.2)}</div>
</section>`;
});

// Decided matchups: a few per screen, score + gap + projected winner only.
lists.forEach((group, li) => {
  const start = afterClose + li * LIST;
  const first = close.length + li * PER_LIST + 1;
  const range = group.length > 1 ? `${first}–${first + group.length - 1}` : `${first}`;
  const team = (s, fav) => `
      <div class="mside${fav ? ' fav' : ''}">
        <img class="mlogo" src="${logo(s.logo)}">
        <div class="mname ltr">${esc(s.name)}</div>
        <div class="mscore">${Math.round(s.live)}</div>
      </div>`;
  html += `
<section class="scene" data-start="${start}" data-end="${start + LIST}">
  <div class="top">
    <div class="tag el" data-in="0.05">כמעט גמור ✅</div>
    <div class="count el ltr" data-in="0.05">${range} / ${games.length}</div>
  </div>
  <div class="mini-list">
    ${group.map((m, j) => `
    <div class="mini el" data-in="${0.3 + j * 0.45}">
      <div class="mteams">${team(m.home, m.home.winProb >= m.away.winProb)}<div class="mvs">–</div>${team(m.away, m.away.winProb > m.home.winProb)}</div>
      <div class="mline">פער <b>${m.gap}</b> · סיכוי לניצחון <span class="mpct ltr">${favPct(m)}</span> ל-<b class="ltr">${esc(m.projectedWinner)}</b></div>
    </div>`).join('')}
  </div>
</section>`;
});

const outStart = afterClose + decidedLen;
html += `
<section class="scene center" data-start="${outStart}" data-end="${total + 1}">
  <div class="big el" data-in="0.1">הכל נקבע<br>הלילה 🔥</div>
  <div class="sub el ltr" data-in="0.6" style="font-size:48px">${esc(closest.home.name)}<br>vs<br>${esc(closest.away.name)}</div>
  <div class="sub el ltr" data-in="0.9">${Math.round(closest.home.winProb)}% – ${100 - Math.round(closest.home.winProb)}%</div>
  <div class="brand el ltr" data-in="1.3">FANTASY HQ</div>
</section>`;
stage.innerHTML = html;

const clamp = x => Math.max(0, Math.min(1, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);

window.render = t => {
  for (const sc of stage.querySelectorAll('.scene')) {
    const s = +sc.dataset.start, e = +sc.dataset.end, lt = t - s;
    const vis = t < s || t > e ? 0 : Math.min(clamp(lt / FADE), clamp((e - t) / FADE));
    sc.style.opacity = vis;
    if (!vis) continue;
    for (const el of sc.querySelectorAll('.el')) {
      const p = ease((lt - +el.dataset.in) / 0.5);
      el.style.opacity = p;
      el.style.transform = `translateY(${(1 - p) * 60}px) scale(${0.96 + 0.04 * p})`;
    }
    for (const el of sc.querySelectorAll('[data-count]')) {
      const p = ease((lt - 0.4) / 1.2);
      el.textContent = Math.round(+el.dataset.count * p);
    }
    for (const el of sc.querySelectorAll('.bar-g')) {
      const p = ease((lt - 1.1 - 0.12 * +el.dataset.i) / 0.5);
      el.style.opacity = p;
    }
    for (const el of sc.querySelectorAll('[data-fill]')) {
      const p = ease((lt - 2.8) / 1.4);
      el.style.width = `${50 + (+el.dataset.fill - 50) * p}%`;
    }
  }
};
window.render(0);
</script>
</body>
</html>
