<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Week 1 Bridge</title>
<link rel="stylesheet" href="../../../../node_modules/@fontsource/heebo/400.css">
<link rel="stylesheet" href="../../../../node_modules/@fontsource/heebo/700.css">
<link rel="stylesheet" href="../../../../node_modules/@fontsource/heebo/900.css">
<style>
  :root {
    --bg: #0B1628; --bg2: #13233D; --line: #1E3050;
    --text: #F0F4F8; --muted: #94A3B8;
    --accent: #C8956C; --hot: #FB923C; --win: #34D399; --lose: #F87171;
    --home: #C8956C; --away: #60A5FA;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: 'Heebo', sans-serif; color: var(--text); }
  .scene { position: absolute; inset: 0; padding: 90px 60px 100px; display: flex; flex-direction: column; opacity: 0; }
  .bg-glow { position: absolute; inset: 0; background:
      radial-gradient(900px 700px at 50% -10%, rgba(200,149,108,.22), transparent 70%),
      radial-gradient(800px 600px at 50% 110%, rgba(96,165,250,.14), transparent 70%); }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .el { will-change: transform, opacity; }
  .pos { color: var(--win); } .neg { color: var(--lose); }

  .center { justify-content: center; align-items: center; text-align: center; gap: 36px; }
  .brand { font-size: 54px; font-weight: 700; letter-spacing: 6px; color: var(--accent); }
  .big { font-size: 130px; font-weight: 900; line-height: 1.02; }
  .sub { font-size: 52px; font-weight: 700; color: var(--muted); }
  .note { font-size: 42px; font-weight: 700; background: var(--bg2); border: 3px solid var(--line); border-radius: 36px; padding: 30px 40px; line-height: 1.4; }
  .note b { color: var(--hot); }
  .hero-logo { width: 300px; height: 300px; border-radius: 56px; object-fit: cover; box-shadow: 0 20px 80px rgba(200,149,108,.35); }

  .top { display: flex; justify-content: space-between; align-items: center; }
  .tag { font-size: 44px; font-weight: 900; padding: 14px 34px; border-radius: 999px; background: var(--bg2); border: 3px solid var(--accent); color: var(--accent); }
  .count { font-size: 38px; color: var(--muted); font-weight: 700; }

  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 40px; }
  .team { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
  .logo { width: 170px; height: 170px; border-radius: 50%; object-fit: cover; border: 6px solid var(--line); background: var(--bg2); }
  .slogo { width: 110px; height: 110px; }
  .team.home .logo { border-color: var(--home); }
  .team.away .logo { border-color: var(--away); }
  .tname { font-size: 42px; font-weight: 900; line-height: 1.1; min-height: 92px; display: flex; align-items: center; }
  .sname { font-size: 34px; min-height: 75px; }
  .owner { font-size: 34px; color: var(--muted); font-weight: 700; }
  .score { font-size: 120px; font-weight: 900; line-height: 1; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .label { font-size: 34px; color: var(--muted); font-weight: 700; }

  .rows { margin-top: 40px; background: var(--bg2); border: 3px solid var(--line); border-radius: 36px; padding: 18px 44px; }
  .row { display: grid; grid-template-columns: 1fr 1.5fr 1fr; align-items: center; padding: 16px 0; border-bottom: 2px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .v { font-size: 52px; font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; }
  .row .l { font-size: 34px; color: var(--muted); font-weight: 700; text-align: center; }

  .prob { margin-top: auto; }
  .prob .winner { text-align: center; font-size: 44px; font-weight: 900; margin-bottom: 18px; }
  .prob .winner span { color: var(--win); }
  .bar { position: relative; height: 84px; border-radius: 999px; overflow: hidden; background: var(--away); display: flex; }
  .bar .fill { height: 100%; background: var(--home); }
  .bar .pct { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; font-size: 46px; font-weight: 900; color: #0B1628; }
  .bar .pct.r { right: 36px; } .bar .pct.l { left: 36px; }
  .barlabel { text-align: center; font-size: 32px; color: var(--muted); margin-top: 16px; font-weight: 700; }

  /* bridge */
  .bridge { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 26px; flex: 1; }
  .col { background: var(--bg2); border: 3px solid var(--line); border-radius: 32px; padding: 24px 22px; display: flex; flex-direction: column; gap: 10px; }
  .col.home { border-color: rgba(200,149,108,.5); } .col.away { border-color: rgba(96,165,250,.5); }
  .bline { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 36px; font-weight: 700; }
  .bline .n { font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bline.total { font-size: 42px; font-weight: 900; padding: 10px 0; border-bottom: 2px solid var(--line); }
  .bline.total:last-child { border-bottom: 0; border-top: 2px solid var(--line); margin-top: auto; }
  .bline.sum { font-size: 36px; color: var(--muted); }
  .drivers-h { font-size: 32px; color: var(--accent); font-weight: 900; margin-top: 14px; }
  .drv { display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px dashed var(--line); }
  .drv .top2 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .drv .who { font-size: 33px; font-weight: 900; }
  .drv .n { font-size: 36px; font-weight: 900; white-space: nowrap; }
  .drv .why { font-size: 28px; color: var(--muted); font-weight: 700; }
  .drv.other .who { color: var(--muted); }

  /* tonight */
  .tlist { display: flex; flex-direction: column; gap: 6px; }
  .tp { display: flex; justify-content: space-between; gap: 10px; font-size: 31px; font-weight: 700; }
  .tp small { color: var(--muted); font-size: 24px; font-weight: 400; }
  .tp .n { font-weight: 900; font-variant-numeric: tabular-nums; }
  .tp .dtd { color: var(--hot); font-size: 24px; }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div id="stage"></div>
<script>
/*
 * Week 1 only — long recap with a projection bridge per matchup.
 * Data: window.RECAP = week1/bridge-data.mts output.
 * Per matchup: A) start-of-week projection, B) start → final bridge with the
 * main drivers, C) last night — every player tonight and the final projection.
 * Every number shown is rounded so that each column adds up exactly on screen.
 */
const D = window.RECAP;
const INTRO = 5, A = 4, B = 7.5, C = 5, OUTRO = 3.5, FADE = 0.35, N_DRIVERS = 5;
const games = D.matchups;
const PER = A + B + C;
const total = INTRO + games.length * PER + OUTRO;
window.DURATION = total;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const logo = src => src ? `../../../../public${src}` : '../../../../public/icon-192.png';
const R = Math.round;
const sgn = n => `<span class="ltr ${n > 0 ? 'pos' : n < 0 ? 'neg' : ''}">${n > 0 ? '+' : n < 0 ? '−' : ''}${Math.abs(n)}</span>`;
const pct = (p, left, other) => left && p > 99 ? '>99%' : left && p < 1 ? '<1%'
  : `${other == null ? R(p) : 100 - R(other)}%`;
const fmtDate = iso => { const d = new Date(iso); return `${d.getUTCDate()}.${d.getUTCMonth() + 1}`; };

// League-wide: points per game vs projection, for the games played so far.
let pts = 0, exp = 0, gp = 0;
for (const m of games) for (const s of [m.home, m.away]) for (const p of s.players) { pts += p.points; exp += p.avg * p.started; gp += p.started; }
const ppg = (pts / gp).toFixed(1), xpg = (exp / gp).toFixed(1);

/** Bridge items for one team, rounded so that start + items = final exactly. */
function bridge(s) {
  const start = R(s.start), final = R(s.final);
  const perf = R(s.performance), gms = final - start - perf;
  const items = [];
  const moves = s.players.filter(p => !p.onRosterAtStart);
  for (const p of s.players) {
    if (p.started && Math.abs(p.performance) >= 0.5) {
      const expPts = Math.round(p.avg * p.started);
      items.push({ v: p.performance, who: p.name,
        why: `${R(p.points)} נק' ב-${p.started} משחקים (צפי ${expPts})` });
    }
    if (p.onRosterAtStart && Math.abs(p.games) >= 0.5) {
      const now = p.started + p.gamesTonight;
      const why = !p.onRosterNow ? `שוחרר · ${now} משחקים במקום ${p.plannedGames}`
        : p.status === 'OUT' && now < p.plannedGames ? `פצוע · ${now} משחקים במקום ${p.plannedGames}`
        : `${now} משחקים במקום ${p.plannedGames}`;
      items.push({ v: p.games, who: p.name, why });
    }
  }
  const movesV = moves.reduce((n, p) => n + p.games, 0);
  const movesG = moves.reduce((n, p) => n + p.started + p.gamesTonight, 0);
  if (moves.length && Math.abs(movesV) >= 0.5)
    items.push({ v: movesV, who: 'שחקנים שנוספו', why: `${moves.length} שחקנים · ${movesG} משחקים נוספים` });
  items.sort((a, b) => Math.abs(b.v) - Math.abs(a.v));
  const top = items.slice(0, N_DRIVERS).map(i => ({ ...i, n: R(i.v) }));
  const other = final - start - top.reduce((n, i) => n + i.n, 0);
  return { start, final, perf, gms, top, other };
}

const stage = document.getElementById('stage');
let html = `
<section class="scene center" data-start="0" data-end="${INTRO}">
  <div class="brand el ltr" data-in="0.1">FANTASY HQ</div>
  <img class="hero-logo el" data-in="0.25" src="../../../../public/icon-maskable-512.png">
  <div class="big el" data-in="0.45">שבוע ${D.week}:<br>איך הגענו לכאן?</div>
  <div class="sub el" data-in="0.8">מהתחזית של תחילת השבוע ועד הלילה האחרון</div>
  <div class="note el" data-in="1.6">כל הליגה השבוע: <b class="ltr">${ppg}</b> נק' למשחק<br>מול תחזית של <b class="ltr">${xpg}</b></div>
</section>`;

games.forEach((m, i) => {
  const s0 = INTRO + i * PER;
  const cnt = `<div class="count el ltr" data-in="0.05">${i + 1} / ${games.length}</div>`;
  const hFav0 = m.home.winProbStart >= m.away.winProbStart, hFav = m.home.winProbNow >= m.away.winProbNow;
  const left = m.home.playersTonight + m.away.playersTonight > 0;

  // A) start of the week
  const sideA = (s, which) => `
    <div class="team ${which}">
      <img class="logo el" data-in="0.15" src="${logo(s.logo)}">
      <div class="tname el ltr" data-in="0.25">${esc(s.name)}</div>
      <div class="owner el" data-in="0.3">${esc(s.owner)}</div>
      <div class="label el" data-in="0.4">תחזית פתיחה</div>
      <div class="score el" data-in="0.4" data-count="${R(s.start)}">0</div>
    </div>`;
  html += `
<section class="scene" data-start="${s0}" data-end="${s0 + A}">
  <div class="top"><div class="tag el" data-in="0.05">א · תחילת השבוע (${fmtDate(D.frozenAt)})</div>${cnt}</div>
  <div class="teams">${sideA(m.home, 'home')}${sideA(m.away, 'away')}</div>
  <div class="rows el" data-in="1.0">
    <div class="row"><div class="v">${m.home.startGames}</div><div class="l">משחקים צפויים</div><div class="v">${m.away.startGames}</div></div>
  </div>
  <div class="prob el" data-in="1.4">
    <div class="winner">פייבוריטית: <span class="ltr">${esc((hFav0 ? m.home : m.away).name)}</span></div>
    <div class="bar">
      <div class="fill" data-fill="${m.home.winProbStart}" data-at="1.6"></div>
      <div class="pct r ltr">${pct(m.home.winProbStart, true)}</div>
      <div class="pct l ltr">${pct(m.away.winProbStart, true, m.home.winProbStart)}</div>
    </div>
    <div class="barlabel">סיכוי לנצח בתחילת השבוע</div>
  </div>
</section>`;

  // B) bridge
  const col = (s, which, d) => {
    const b = bridge(s);
    return `
    <div class="col ${which} el" data-in="${d}">
      <div class="team"><img class="logo slogo" src="${logo(s.logo)}"><div class="tname sname ltr">${esc(s.name)}</div></div>
      <div class="bline total"><span>תחזית פתיחה</span><span class="n">${b.start}</span></div>
      <div class="bline sum"><span>ביצועי שחקנים</span><span class="n">${sgn(b.perf)}</span></div>
      <div class="bline sum"><span>משחקים והעברות</span><span class="n">${sgn(b.gms)}</span></div>
      <div class="drivers-h">מה הזיז את התחזית</div>
      ${b.top.map(it => `
      <div class="drv"><div class="top2"><span class="who ltr">${esc(it.who)}</span><span class="n">${sgn(it.n)}</span></div><div class="why">${it.why}</div></div>`).join('')}
      <div class="drv other"><div class="top2"><span class="who">כל השאר</span><span class="n">${sgn(b.other)}</span></div></div>
      <div class="bline total"><span>תחזית סיום</span><span class="n">${b.final}</span></div>
    </div>`;
  };
  const s1 = s0 + A;
  html += `
<section class="scene" data-start="${s1}" data-end="${s1 + B}">
  <div class="top"><div class="tag el" data-in="0.05">ב · מה קרה במהלך השבוע</div>${cnt}</div>
  <div class="bridge">${col(m.home, 'home', 0.3)}${col(m.away, 'away', 0.9)}</div>
</section>`;

  // C) last night
  const tl = s => s.tonightPlayers.length
    ? s.tonightPlayers.map(p => `<div class="tp"><span class="ltr">${esc(p.name)} <small>${p.nba}</small>${p.status !== 'ACTIVE' ? ` <span class="dtd">${p.status === 'DAY_TO_DAY' ? 'DTD' : esc(p.status)}</span>` : ''}</span><span class="n">${p.avg}</span></div>`).join('')
    : `<div class="tp"><span class="label">אין שחקנים הלילה</span></div>`;
  const colC = (s, which, d) => `
    <div class="col ${which} el" data-in="${d}">
      <div class="team"><img class="logo slogo" src="${logo(s.logo)}"><div class="tname sname ltr">${esc(s.name)}</div></div>
      <div class="bline total"><span>ניקוד עכשיו</span><span class="n">${R(s.live)}</span></div>
      <div class="drivers-h">משחקים הלילה (${s.playersTonight}) · ממוצע</div>
      <div class="tlist">${tl(s)}</div>
      <div class="bline sum" style="margin-top:auto"><span>צפי הלילה</span><span class="n ltr">+${s.tonight.toFixed(1)}</span></div>
      <div class="bline total"><span>תחזית סיום</span><span class="n">${R(s.final)}</span></div>
    </div>`;
  const s2 = s1 + B;
  html += `
<section class="scene" data-start="${s2}" data-end="${s2 + C}">
  <div class="top"><div class="tag el" data-in="0.05">ג · הלילה האחרון</div>${cnt}</div>
  <div class="bridge" style="flex:0 1 auto">${colC(m.home, 'home', 0.3)}${colC(m.away, 'away', 0.6)}</div>
  <div class="prob el" data-in="1.4">
    <div class="winner">מנצח צפוי: <span class="ltr">${esc((hFav ? m.home : m.away).name)}</span></div>
    <div class="bar">
      <div class="fill" data-fill="${m.home.winProbNow}" data-at="1.6"></div>
      <div class="pct r ltr">${pct(m.home.winProbNow, left)}</div>
      <div class="pct l ltr">${pct(m.away.winProbNow, left, m.home.winProbNow)}</div>
    </div>
    <div class="barlabel">סיכוי לנצח עכשיו (בתחילת השבוע: ${pct(m.home.winProbStart, true)} – ${pct(m.away.winProbStart, true, m.home.winProbStart)})</div>
  </div>
</section>`;
});

const outStart = INTRO + games.length * PER;
html += `
<section class="scene center" data-start="${outStart}" data-end="${total + 1}">
  <div class="big el" data-in="0.1">הכל נקבע<br>הלילה 🔥</div>
  <div class="sub el" data-in="0.6">שבוע ${D.week} · ${games.length} מאצ'אפים</div>
  <div class="brand el ltr" data-in="1.0">FANTASY HQ</div>
</section>`;
stage.innerHTML = html;

const clamp = x => Math.max(0, Math.min(1, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);

window.render = t => {
  for (const sc of stage.querySelectorAll('.scene')) {
    const s = +sc.dataset.start, e = +sc.dataset.end, lt = t - s;
    const vis = t < s || t > e ? 0 : Math.min(clamp(lt / FADE), clamp((e - t) / FADE));
    sc.style.opacity = vis;
    if (!vis) continue;
    for (const el of sc.querySelectorAll('.el')) {
      const p = ease((lt - +el.dataset.in) / 0.5);
      el.style.opacity = p;
      el.style.transform = `translateY(${(1 - p) * 60}px) scale(${0.96 + 0.04 * p})`;
    }
    for (const el of sc.querySelectorAll('[data-count]')) {
      const p = ease((lt - 0.4) / 1.0);
      el.textContent = Math.round(+el.dataset.count * p);
    }
    for (const el of sc.querySelectorAll('[data-fill]')) {
      const p = ease((lt - +el.dataset.at) / 1.2);
      el.style.width = `${50 + (+el.dataset.fill - 50) * p}%`;
    }
  }
};
window.render(0);
</script>
</body>
</html>
