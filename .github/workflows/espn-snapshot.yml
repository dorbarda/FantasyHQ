name: ESPN snapshot

# Nightly refresh of data/snapshots/*.json, twice a day in Israel time:
#   06:00 — so the home page's daily recap and clips are there when people wake up
#   09:00 — catch-up: a late West Coast game can still be on at 06:00; this run
#           fixes its numbers and picks up late clips (no commit if nothing changed)
# GitHub cron is UTC only, so both the winter (UTC+2) and summer (UTC+3) times
# are scheduled and the first step skips the pair that doesn't match today's
# Israel offset. The commit triggers a Vercel redeploy, so the analytical pages
# rebuild on fresh data every morning. A red run means the ESPN cookies
# expired — GitHub emails the repo owner on workflow failure.

on:
  schedule:
    - cron: '0 4 * * *' # 06:00 Israel winter
    - cron: '0 7 * * *' # 09:00 Israel winter
    - cron: '0 3 * * *' # 06:00 Israel summer
    - cron: '0 6 * * *' # 09:00 Israel summer
  workflow_dispatch:

jobs:
  # Manual runs always go ahead; scheduled ones only at today's Israel times.
  clock:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(TZ=Asia/Jerusalem date +%z)" = "+0300" ]; then wanted="0 3 * * *|0 6 * * *"; else wanted="0 4 * * *|0 7 * * *"; fi
          case "|$wanted|" in
            *"|$SCHEDULE|"*) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Not 06:00/09:00 in Israel today, skipping."; echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

  snapshot:
    needs: clock
    if: needs.clock.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build snapshots
        run: npx tsx scripts/build-snapshots.mts
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          # Repo *variable* is the documented home for this, but accept a secret
          # too — setting it in the wrong tab is silent and looks like nothing
          # happened at all.
          SEASON: ${{ vars.SEASON || secrets.SEASON }}
          # Optional: highlight clips for the recap. Missing or failing, the
          # highlights snapshot is skipped and the run still passes — a red run
          # must keep meaning "the ESPN cookies expired".
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          # Preferred source for those clips: the official NBA YouTube channel.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # Final scores into the frozen week projections (week-projections Action
      # freezes them on Sundays). Only empty results are filled; a no-op most days.
      - name: Fill week results
        run: npx tsx scripts/freeze-week-projections.mts --results-only
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          SEASON: ${{ vars.SEASON || secrets.SEASON }}
      - name: Commit snapshots
        run: |
          git config user.name "espn-snapshot-bot"
          git config user.email "actions@github.com"
          git add data/snapshots data/projections
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "chore: nightly ESPN data snapshot [skip ci]"
            # main can move while this job runs (a PR merged meanwhile) — only
            # this bot touches these data files, so rebasing onto it is safe.
            git pull --rebase origin main
            git push
          fi
