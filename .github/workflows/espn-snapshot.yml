name: ESPN snapshot

# Nightly refresh of data/snapshots/*.json. Runs after all NBA games finish
# (09:00 UTC = noon Israel). The commit triggers a Vercel redeploy, so the
# analytical pages rebuild on fresh data every morning. A red run means the
# ESPN cookies expired — GitHub emails the repo owner on workflow failure.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build snapshots
        run: npx tsx scripts/build-snapshots.mts
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          SEASON: ${{ vars.SEASON }}
          # Optional: highlight clips for the recap. Missing or failing, the
          # highlights snapshot is skipped and the run still passes — a red run
          # must keep meaning "the ESPN cookies expired".
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      - name: Commit snapshots
        run: |
          git config user.name "espn-snapshot-bot"
          git config user.email "actions@github.com"
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "chore: nightly ESPN data snapshot [skip ci]"
            git push
          fi
